
name: Build MajaCall APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MajaCallAndroid_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -q MajaCallAndroid_Project.zip -d source
          cd source/MajaCallAndroid
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MajaCall-APK
          path: source/MajaCallAndroid/app/build/outputs/apk/debug/app-debug.apk
